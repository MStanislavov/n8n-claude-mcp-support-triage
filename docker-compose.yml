name: support-triage

x-n8n-env: &n8n-env
  N8N_HOST: localhost
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  N8N_WEBHOOK_URL: http://localhost:5678/
  GENERIC_TIMEZONE: UTC
  TZ: UTC
  N8N_SECURE_COOKIE: "false"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

services:
  mcp-server:
    build: ./mcp-server
    image: support-triage-mcp:local
    environment:
      SUPPORT_DB_PATH: /data/support.db
    volumes:
      - mcp-data:/data
    ports:
      - "127.0.0.1:${MCP_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  n8n-init:
    image: n8nio/n8n:2.42.6
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      <<: *n8n-env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/init.sh:/init/init.sh:ro
      - ./workflows:/seed/workflows:ro
    restart: "no"

  n8n:
    image: n8nio/n8n:2.42.6
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      mcp-server:
        condition: service_healthy
    environment:
      <<: *n8n-env
    volumes:
      - n8n-data:/home/node/.n8n
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    restart: unless-stopped

volumes:
  n8n-data:
  mcp-data:
